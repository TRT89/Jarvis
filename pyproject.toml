[project]
name = "jarvis"
version = "0.1.0"
description = "Personal Voice Assistant (Learning project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = ["pytest"]
